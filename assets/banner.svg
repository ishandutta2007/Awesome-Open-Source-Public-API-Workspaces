<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".4"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".35"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatFast{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(-2deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes particleFloat{0%{transform:translate(0,0);opacity:.2}50%{transform:translate(20px,-25px);opacity:.8}}.glow1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.glow2{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:1000px 250px}.flow-path{stroke-dasharray:12,12;animation:flowLine 14s linear infinite}.floating-card1{animation:floatSlow 7s ease-in-out infinite}.floating-card2{animation:floatFast 6s ease-in-out infinite 1s}.floating-card3{animation:floatSlow 8s ease-in-out infinite 2s}</style>